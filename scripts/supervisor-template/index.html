<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>石墨迁移监督器</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#18191c}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:980px;margin:auto;background:#fff;border:1px solid #e4e6eb;border-radius:16px;padding:28px}h1{font-size:22px;margin:0}.top,.heartbeat{display:flex;justify-content:space-between;gap:16px}.status{color:#5c6068}.count{text-align:right;font-size:28px}.track{height:14px;background:#edf0f3;border-radius:99px;overflow:hidden;margin:22px 0 8px}.fill{height:100%;background:#378add;transform-origin:left;transition:.3s}.heartbeat{font-size:13px;color:#858a93}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}.metric,.activity,.list{background:#f5f6f8;border-radius:10px;padding:14px}.metric span,.label{display:block;color:#686d76;font-size:13px}.metric strong{font-size:22px}.activity,.list{margin-top:16px}.activity p{margin:8px 0}.list table{width:100%;border-collapse:collapse;font-size:13px}.list th,.list td{text-align:left;border-bottom:1px solid #ddd;padding:8px;vertical-align:top}.list a{color:#185fa5}.reason{padding:12px;background:#e6f1fb;color:#0c447c;border-radius:8px}.error{color:#a32d2d}button{display:none;border:0;background:#185fa5;color:#fff;padding:10px 16px;border-radius:8px;cursor:pointer}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}.top{display:block}.count{text-align:left}.list{overflow:auto}}</style></head>
<body><main><div class="top"><div><h1>石墨迁移监督器</h1><p class="status" id="status">正在读取状态</p></div><div class="count" id="count">-- / --</div></div><div class="track"><div class="fill" id="fill"></div></div><div class="heartbeat"><span id="percent">--%</span><span id="updated">每10秒刷新</span></div>
<div class="metrics"><div class="metric"><span>正常迁移</span><strong id="normal">--</strong></div><div class="metric"><span>兜底迁移</span><strong id="fallback">--</strong></div><div class="metric"><span>无法正常迁移</span><strong id="unmigratable">--</strong></div><div class="metric"><span>剩余</span><strong id="remaining">--</strong></div><div class="metric"><span>失败</span><strong id="failed">--</strong></div><div class="metric"><span>待重试候选</span><strong id="candidate">--</strong></div><div class="metric"><span>明确跳过</span><strong id="skipped">--</strong></div><div class="metric"><span>迁移进程</span><strong id="pid">--</strong></div></div>
<div class="activity"><p><span class="label">当前任务</span><span id="task">--</span></p><p><span class="label">导出尝试</span><span id="attempt">--</span></p><p><span class="label">当前阶段</span><span id="phase">--</span></p><p><span class="label">最后活动</span><span id="activity">--</span></p></div><p class="reason" id="reason"></p><button id="restart">安全断点续跑</button><p class="error" id="error"></p>
<div class="list"><h2>无法正常 API 迁移文件</h2><table><thead><tr><th>名称</th><th>类型</th><th>路径</th><th>原因</th><th>兜底结果</th><th>石墨链接</th></tr></thead><tbody id="files"></tbody></table></div></main>
<script>const $=id=>document.getElementById(id);const fmt=v=>v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'--';async function api(path,opt={}){const r=await fetch(path,{cache:'no-store',...opt});const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);return d}function render(d){$('status').textContent=d.statusLabel;$('count').textContent=`${d.processed} / ${d.total}`;$('percent').textContent=`${d.percent.toFixed(1)}%`;$('fill').style.transform=`scaleX(${d.percent/100})`;$('updated').textContent=`状态落盘：${fmt(d.updatedAt)}`;$('normal').textContent=d.normalSuccess;$('fallback').textContent=d.fallbackSuccess;$('unmigratable').textContent=d.skippedUnmigratable;$('remaining').textContent=d.remaining;$('failed').textContent=d.failed;$('candidate').textContent=d.fallbackCandidate;$('skipped').textContent=d.explicitlySkipped;$('pid').textContent=d.processAlive?d.migrationPid:'未运行';$('task').textContent=d.currentTask||'--';$('attempt').textContent=d.exportAttempt||'--';$('phase').textContent=d.phase||'--';$('activity').textContent=`${fmt(d.lastActivityAt)}${d.activityAgeSeconds==null?'':`（${d.activityAgeSeconds}秒前）`}`;$('reason').textContent=d.reason||'';$('restart').style.display=d.canRestart?'inline-block':'none';$('files').innerHTML=(d.unmigratableFiles||[]).map(f=>`<tr><td>${esc(f.name)}</td><td>${esc(f.type)}</td><td>${esc(f.path)}</td><td>${esc(f.reason)}</td><td>${f.fallbackSuccess?'已成功':'未完成'}</td><td><a href="${encodeURI(f.shimoUrl||'#')}" target="_blank">打开</a></td></tr>`).join('')}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function refresh(){try{render(await api(`/api/progress?t=${Date.now()}`));$('error').textContent=''}catch(e){$('error').textContent=`监督器连接失败：${e.message}`}}$('restart').onclick=async()=>{if(!$('restart').dataset.armed){$('restart').dataset.armed='1';$('restart').textContent='再次点击确认启动';return}try{await api('/api/restart',{method:'POST',headers:{'X-Migration-Control':'restart','Content-Type':'application/json'},body:'{}'});$('restart').dataset.armed='';$('restart').textContent='安全断点续跑';setTimeout(refresh,1200)}catch(e){$('error').textContent=e.message}};refresh();setInterval(refresh,10000)</script></body></html>
